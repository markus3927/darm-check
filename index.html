<style>
@import url('https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap');
:root{
  --royal:#1565C0; --dunkel:#0D3E6A; --hellblau:#D6E8F7; --akzent:#42A5F5;
  --bg:#f0f4f8; --text:#2C2C2C; --grau:#6b7785; --linie:#dfe6ee;
  --kill:#C62828; --heal:#1565C0; --braun:#8D6E63;
  --sibo:#8D6E63; --path:#C62828; --leaky:#1565C0;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Source Sans 3','DejaVu Sans',Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.45;-webkit-text-size-adjust:100%}
.master-header{background:linear-gradient(180deg,#3f63dd,#182f83);padding-top:env(safe-area-inset-top,0px)}
.header-content{display:flex;flex-direction:column;align-items:center;padding:18px 16px 14px;text-align:center}
.header-brand{display:flex;align-items:center;justify-content:center;gap:12px}
.header-logo{height:44px;width:44px;object-fit:contain;flex:none}
.header-title{font-size:23px;font-weight:700;color:#fff;letter-spacing:.3px}
.header-title span{color:var(--hellblau)}
.header-desc{font-size:13px;color:var(--hellblau);margin-top:4px}
.accent-line{height:3px;background:var(--akzent)}
main{max-width:760px;margin:0 auto;padding:16px}
.box{background:#fff;border-radius:14px;box-shadow:0 1px 4px rgba(0,0,0,.08);padding:16px;margin-bottom:14px}
label.t{display:block;font-weight:700;color:var(--dunkel);margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--linie);border-radius:10px;padding:12px;font:inherit;font-size:1rem;resize:vertical;background:#fbfdff;color:var(--text)}
textarea:focus{outline:none;border-color:var(--akzent);box-shadow:0 0 0 3px rgba(66,165,245,.2)}
.btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border:none;border-radius:10px;padding:11px 16px;font-weight:600;font-size:.95rem}
.b-main{background:var(--royal);color:#fff;flex:1}
.b-main:active{background:var(--dunkel)}
.b-sec{background:var(--hellblau);color:var(--dunkel)}
.hint{font-size:.83rem;color:var(--grau);margin-top:8px}
.erkannt{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tag{background:var(--hellblau);color:var(--dunkel);border-radius:6px;padding:3px 8px;font-size:.8rem;font-weight:600}
.leer{color:var(--grau);font-size:.9rem}
.offen{width:100%;margin-top:8px;font-size:.85rem;color:var(--grau);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag-off{background:#FFF4E0;color:#A86400}
.summary{border-left:5px solid var(--royal)}
.summary h2{margin:0 0 6px;font-size:1.1rem;color:var(--dunkel)}
.summary p{margin:0}
.card{border-top:5px solid var(--c);padding-top:14px}
.card .kopf{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.card h3{margin:0;font-size:1.15rem;color:var(--c)}
.pct{font-size:1.35rem;font-weight:700;color:var(--c);white-space:nowrap}
.hs{margin-top:12px;font-size:.78rem;font-weight:700;color:var(--grau);text-transform:uppercase;letter-spacing:.5px}
.summary .hinweis{margin-top:10px;font-size:.84rem;color:#5c4100;background:#FFF6E0;border-left:4px solid #E8A317;border-radius:8px;padding:9px 12px}
.sumrow{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.sumrow span{flex:1;min-width:90px;background:#f4f7fa;border-radius:10px;padding:8px 10px;text-align:center;font-size:.8rem;color:var(--grau)}
.sumrow b{display:block;font-size:1.25rem;color:var(--c)}
.hinw{background:#f7fafd;border-left:4px solid var(--c);border-radius:8px;padding:9px 12px;margin-top:10px;font-size:.9rem}
.hinw p{margin:0 0 6px}.hinw p:last-child{margin:0}
.erkl{font-size:.93rem;color:var(--text)}
.info .erkl p{color:var(--text)}
.erkl h4{margin:14px 0 4px;color:var(--dunkel);font-size:.98rem}
.erkl h4:first-child{margin-top:4px}
.erkl p{margin:0}
.erkl .kreis{background:var(--hellblau);border-radius:10px;padding:10px 12px;margin-top:12px;color:var(--dunkel);font-weight:600;text-align:center;line-height:1.6}
.bar{height:9px;background:#eef2f6;border-radius:6px;margin:10px 0 4px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--c);border-radius:6px;transition:width .4s}
.kurz{font-size:.9rem;color:var(--grau);margin:6px 0 10px}
.warum h5,.prog h5{margin:12px 0 6px;font-size:.88rem;color:var(--dunkel);text-transform:uppercase;letter-spacing:.4px}
.wi{padding:8px 0;border-bottom:1px solid #f0f3f6}
.wi:last-child{border-bottom:none}
.wi b{display:block;font-size:.95rem}
.wi .pkt{color:var(--c);letter-spacing:1px;font-size:.8rem;margin-left:4px}
.wi span.tx{display:block;font-size:.88rem;color:#4a5560;margin-top:2px}
.mehr{margin-top:12px;background:var(--hellblau);color:var(--dunkel);width:100%}

var GRUPPEN = {v:"Verdauung", a:"Allgemein & Psyche", n:"Kopf, Nerven & Sinne", b:"Muskeln, Gelenke & Rücken", h:"Haut & Allergie", o:"Herz, Hormone & Organe", i:"Infekt & Erreger"};

/* ---------- Text-Normalisierung ---------- */
function norm(t){
  return (" " + String(t).toLowerCase()
    .replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss")
    .replace(/[éèê]/g,"e").replace(/[àâ]/g,"a")
    .replace(/[^a-z0-9]+/g," ").replace(/\s+/g," ").trim() + " ");
}
/* Schlüssel einmal vorbereiten */
S.forEach(function(m){
  m.kk = m.k.map(function(k){
    var ganz = k.charAt(0) === "=";
    var n = norm(ganz ? k.slice(1) : k).trim();
    return {sp:n, cp:n.replace(/ /g,""), ganz:ganz};
  });
  m.xx = (m.x || []).map(function(x){ return norm(x).trim().replace(/ /g,""); });
});

function klauseln(text){
  /* in Teilsätze trennen; Teilsätze, die mit «kein/keine/ohne» beginnen, werden ignoriert */
  return String(text).split(/[,;.\n\/]+|\s+und\s+|\s+sowie\s+/i).map(function(r){
    return {r:r.trim(), n:norm(r)};
  }).filter(function(c){
    return c.n.trim() && !/^ (kein|keine|keinen|keiner|keinerlei|ohne) /.test(c.n);
  });
}

function trifft(m, kl){
  for (var i=0;i<kl.length;i++){
    var sp = kl[i].n, cp = sp.replace(/ /g,"");
    if (m.xx.some(function(x){ return cp.indexOf(x) >= 0; })) continue;
    for (var j=0;j<m.kk.length;j++){
      var k = m.kk[j];
      if (k.ganz || k.cp.length <= 4){ if (sp.indexOf(" " + k.sp + " ") >= 0) return true; }
      else if (cp.indexOf(k.cp) >= 0) return true;
    }
  }
  return false;
}

/* ---------- Zustand ---------- */
var getippt = {};

function auswerten(){
  var text = document.getElementById("eingabe").value;
  var kl = klauseln(text);
  var hits = S.filter(function(m){ return getippt[m.id] || (kl.length && trifft(m, kl)); });

  var sc = {s:0,p:0,l:0}, wi = {s:[],p:[],l:[]}, erreger = {};
  hits.forEach(function(m){
    ["s","p","l"].forEach(function(f,i){
      if (m.w[i] > 0){ sc[f] += m.w[i]; wi[f].push({n:m.n, w:m.w[i], t:(m.y && m.y[f]) || ""}); }
    });
    (m.e||[]).forEach(function(x){ erreger[x] = (erreger[x]||0) + 1; });
  });
  /* Folgewirkungen auf die Barriere */
  if (sc.s >= 6){ sc.l += 1; wi.l.push({n:"Folge von SIBO", w:1, t:"Eine länger bestehende Fehlbesiedlung reizt die Schleimhaut — Leaky Gut folgt oft."}); }
  if (sc.p >= 6){ sc.l += 1; wi.l.push({n:"Folge der Erregerlast", w:1, t:"Erreger und ihre Gifte greifen die Darmbarriere an."}); }
  ["s","p","l"].forEach(function(f){ wi[f].sort(function(a,b){ return b.w - a.w; }); });

  var offen = kl.filter(function(c){ return !S.some(function(m){ return trifft(m,[c]); }); }).map(function(c){ return c.r; });
  zeigeErkannt(hits, offen);
  zeigeErgebnis(sc, wi, erreger, hits.length, hits);
}

/* Punkte → Prozent: steigt rasch an und nähert sich 100 % nur langsam */
function prozent(x){ return x <= 0 ? 0 : Math.min(98, Math.round(100 * (1 - Math.exp(-x / 7)))); }

function esc(t){ return String(t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }


function zeigeErkannt(hits, offen){
  var box = document.getElementById("erkanntBox"), el = document.getElementById("erkannt");
  var text = document.getElementById("eingabe").value.trim();
  if (!hits.length && !text){ box.style.display = "none"; return; }
  box.style.display = "";
  el.innerHTML = hits.length
    ? hits.map(function(m){ return '<span class="tag">' + esc(m.n) + '</span>'; }).join("")
    : '<span class="leer">Noch kein bekanntes Merkmal erkannt.</span>';
  if (offen && offen.length){
    el.innerHTML += '<div class="offen"><b>Nicht erkannt:</b> ' + offen.map(function(o){ return '<span class="tag tag-off">' + esc(o) + '</span>'; }).join("") + '</div>';
  }
}

function zeigeErgebnis(sc, wi, erreger, anzahl, hits){
  var H = {}; (hits||[]).forEach(function(m){ H[m.id] = m; });
  var out = document.getElementById("ergebnis");
  if (!anzahl){ out.innerHTML = ""; return; }

  var order = ["s","p","l"].sort(function(a,b){ return sc[b] - sc[a]; });
  var sicht = order.filter(function(f){ return sc[f] > 0; });
  var aktiv = order.filter(function(f){ return sc[f] >= 3; });

  /* Zusammenfassung */
  var sum;
  if (!aktiv.length){
    sum = "Keine deutliche Spur — die Beschwerden zeigen nur leise in Richtung Darm.";
  } else {
    sum = "Hauptspur: <b>" + esc(F[aktiv[0]].name) + "</b>" +
          (aktiv.length > 1 ? ", dazu " + esc(aktiv.slice(1).map(function(f){ return F[f].name; }).join(" und ")) : "") + ".";
  }
  var html = '<section class="box summary"><h2>Einschätzung</h2><p>' + sum + '</p><div class="hs">Hinweisstärke</div><div class="sumrow">' +
    order.map(function(f){ return '<span style="--c:' + F[f].farbe + '"><b>' + prozent(sc[f]) + ' %</b>' + esc(F[f].name) + '</span>'; }).join("") +
    '</div><p class="hinweis">Die Zahlen zeigen, wie stark deine Angaben in diese Richtung deuten. Das ist keine Diagnose und kein Ersatz für eine ärztliche Abklärung.</p><button class="mehr" id="erklBtn">Was steckt dahinter?</button><div class="info" id="erkl">' + ERKLAERUNG + '</div></section>';

  /* Karten — nur wo es einen Hinweis gibt */
  sicht.forEach(function(f){
    var fa = F[f], pct = prozent(sc[f]);
    html += '<section class="box card" style="--c:' + fa.farbe + '">' +
      '<div class="kopf"><h3>' + esc(fa.name) + '</h3><span class="pct">' + pct + ' %</span></div>' +
      '<div class="bar"><span style="width:' + pct + '%"></span></div>' +
      '<p class="kurz">' + esc(fa.kurz) + '</p>';

    html += '<div class="warum"><h5>Warum</h5>' + wi[f].map(function(x){
      return '<div class="wi"><b>' + esc(x.n) + '<span class="pkt">' + "●●●".slice(0, x.w) + '</span></b>' +
             (x.t ? '<span class="tx">' + esc(x.t) + '</span>' : '') + '</div>';
    }).join("") + '</div>';

    var hw = hinweise(f, H);
    if (hw) html += '<div class="hinw">' + hw + '</div>';

    html += '</section>';
  });


  out.innerHTML = html;
}

/* ---------- Kurze Praxis-Hinweise, nur wenn sie etwas Neues sagen ---------- */
function hinweise(f, H){
  var P = [];
  if (f === "s"){
    var d = !!H.durchfall, v = !!H.verstopfung, w = !!H.reizdarm;
    if ((d && v) || w) P.push("<b>Form:</b> Mischform — Wasserstoff- und Methanbildner zugleich.");
    else if (v) P.push("<b>Form:</b> Methan-Form (Verstopfung) — gilt als die hartnäckigere Art.");
    else if (d) P.push("<b>Form:</b> Wasserstoff-Form (Durchfall) — die häufigste Art.");
    if (H.geruch) P.push("<b>Schwefel-Form:</b> schwefelreiche Kost (Eier, Kohl, Zwiebeln) eher meiden.");
    if (H.postinfekt || H.op || H.narben || H.diabetes || H.schilddr || H.chemo || H.covid || H.parkinson)
      P.push("<b>Putzwelle:</b> Die Selbstreinigung des Dünndarms (MMC) ist wahrscheinlich gestört — darum kommt SIBO bei solchen Auslösern gern wieder.");
    if (H.ppi) P.push("<b>Säureblocker:</b> Ohne Magensäure fehlt die erste Keimsperre — die Tür für Keime steht offen.");
  }
  if (f === "p" && (H.pilz || H.heisshunger || H.zunge || H.antibio))
    P.push("<b>Candida:</b> Hefepilze leben von Zucker und wachsen gern zusammen mit SIBO.");
  if (f === "l" && (H.schmerzmittel || H.alkohol || H.gluten))
    P.push("<b>Bremse:</b> " + [H.schmerzmittel && "Schmerzmittel", H.alkohol && "Alkohol", H.gluten && "Gluten"].filter(Boolean).join(", ") + " öffnet die Barriere immer wieder.");
  return P.length ? "<p>" + P.join("</p><p>") + "</p>" : "";
}

var ERKLAERUNG = '<div class="erkl">' +
 '<h4>Der Darm ist eine Grenze</h4><p>Er ist die grösste Grenze zwischen innen und aussen. Hier entscheidet der Körper, was hinein darf und was draussen bleibt. Rund drei Viertel der Abwehr sitzen deshalb am Darm.</p>' +
 '<h4>Dünndarm und Dickdarm</h4><p><b>Dünndarm</b> (rund 5–6 Meter): Hier wird die Nahrung zerlegt und fast alles aufgenommen, was der Körper braucht — Eiweiss, Fett, Zucker, Vitamine und Mineralstoffe. Damit das gelingt, leben hier normal nur sehr wenige Bakterien. Zwischen den Mahlzeiten schiebt eine Reinigungswelle (Putzwelle) Reste und Keime weiter Richtung Dickdarm.</p><p style="margin-top:8px"><b>Dickdarm</b> (rund 1,5 Meter): Hier wird dem Brei Wasser entzogen und der Stuhl geformt. Er ist das eigentliche Zuhause der Darmbakterien — Billionen davon verwerten, was der Dünndarm übrig lässt, und bilden dabei Stoffe, von denen sich die Darmschleimhaut ernährt.</p>' +
 '<h4>Guter Stuhlgang heisst nicht gesunder Dünndarm</h4><p>Der Stuhl wird erst im Dickdarm geformt. Eine Fehlbesiedlung sitzt aber im Dünndarm, also davor. Darum kann der Stuhlgang ganz normal sein und trotzdem SIBO bestehen. Sie zeigt sich dann eher durch Blähbauch nach dem Essen, Müdigkeit, Nährstoffmangel, Haut- oder Gelenkbeschwerden. Auch eine Stuhlprobe sagt wenig über den Dünndarm aus — sie zeigt vor allem, was im Dickdarm lebt.</p>' +
 '<h4>SIBO — die falschen Bewohner am falschen Ort</h4><p>Im Dünndarm leben normal kaum Bakterien. Wandern zu viele dorthin, essen sie mit: Sie vergären die Nahrung, bevor der Körper sie aufnehmen kann. Das gibt Gas und Blähbauch — und es fehlen Nährstoffe wie B12, Eisen und Magnesium.</p>' +
 '<h4>Versteckte Pathogene — stille Untermieter</h4><p>Viren, Bakterien, Pilze oder Parasiten, die nach einem Infekt nie ganz verschwunden sind. Sie verstecken sich in Nerven, Zähnen, Gelenken oder unter einer Schutzschicht (Biofilm) und halten die Abwehr dauernd beschäftigt.</p>' +
 '<h4>Leaky Gut — die undichte Grenze</h4><p>Die Darmschleimhaut ist nur eine einzige Zellschicht dick. Wird sie dauernd gereizt, lockern sich die Dichtungen zwischen den Zellen. Dann gelangt ins Blut, was draussen bleiben sollte: unverdaute Nahrung, Bakterienteile, Gifte.</p>' +
 '<h4>Was alle drei gemeinsam tun</h4><p>Sie reizen das Abwehrsystem — dauernd und leise. Diese stille Entzündung wandert mit dem Blut durch den ganzen Körper und zeigt sich dort, wo jemand am schwächsten ist: beim einen in der Haut, beim anderen in den Gelenken, im Kopf, in den Nerven oder in der Stimmung. Darum sehen die Beschwerden so verschieden aus, obwohl dahinter oft dasselbe steckt.</p>' +
 '<h4>Ein Kreislauf</h4><p>Die drei verstärken sich gegenseitig:</p>' +
 '<div class="kreis">Erreger &amp; SIBO reizen die Schleimhaut<br>↓<br>die Schleimhaut wird durchlässig<br>↓<br>die Abwehr wird müde<br>↓<br>Erreger &amp; Bakterien breiten sich weiter aus</div>' +
 '</div>';
